# qixidi MCP 端点 nginx 反代片段
#
# 与 /api/ 剥前缀写法（proxy_pass http://127.0.0.1:9001/; 末尾 / 去掉 /api 前缀）不同，
# /mcp 必须保留原路径转发：proxy_pass 不带末尾 /，nginx 原样传 /mcp 给后端。
#
# proxy_buffering off：MCP Streamable HTTP 需要 SSE 流式响应，缓冲会卡死事件流。
# proxy_http_version 1.1 + 空闲超时：SSE 长连接依赖 HTTP/1.1 keep-alive。
location /mcp {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
