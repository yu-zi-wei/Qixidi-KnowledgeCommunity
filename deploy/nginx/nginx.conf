# 栖息地站点 nginx 配置（参考自生产环境）
#
# 使用方式：将本文件放到 /etc/nginx/conf.d/ 下（即 nginx.conf 的 http 块内 include）
# 按自己的环境修改：域名、证书路径（acme.sh 签发）、日志路径、
# 管理后台静态资源根目录、后端/门户端口
#
# 端口约定：9001 = 后端 qixidi-service；9007 = 门户 qixidi-web-nuxt3（SSR）；
#           9300 = MinIO（可选）。管理后台 qixidi-web-admin 为纯静态部署。

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name qixidi.top;

    return 301 https://$host$request_uri;
}

# 门户网站（Nuxt SSR）
server {
    listen 443 ssl http2;
    server_name qixidi.top;
    access_log  /data/log/nginx/qixidi-top.log;

    # SSL 证书配置
    ssl_certificate     /root/.acme.sh/qixidi.top_ecc/qixidi.top.cer;
    ssl_certificate_key /root/.acme.sh/qixidi.top_ecc/qixidi.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:9007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API：/api 前缀转发到后端
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        ## WebSocket（实时私信 / 消息通知）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        ## SSE 流式响应（AI 生成）不缓冲；文件上传不受默认 1m 限制
        proxy_buffering off;
        client_max_body_size 20m;
    }

    # MCP 端点（AI agent 通过 nginx 接入；agent 直连后端时可省略本 location）
    # 无状态 SSE/流式，需关闭缓冲、放宽超时；图片工具上传 ≤10MB
    location /mcp {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 11m;
    }
}

# 服务端公网地址（可选：后端直通域名，供服务器间调用 / agent 直连）
server {
    listen 443 ssl http2;
    server_name server.qixidi.top;
    access_log /data/log/nginx/server-qixidi-top.log;
    ssl_certificate     /root/.acme.sh/qixidi.top_ecc/qixidi.top.cer;
    ssl_certificate_key /root/.acme.sh/qixidi.top_ecc/qixidi.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_pass_request_headers on;
        ## WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        ## SSE / 流式响应不缓冲；上传不受默认 1m 限制
        proxy_buffering off;
        client_max_body_size 20m;
    }
}

# 管理后台（qixidi-web-admin 纯静态部署）
server {
    listen 443 ssl http2;
    server_name admin.qixidi.top;

    ssl_certificate     /root/.acme.sh/qixidi.top_ecc/qixidi.top.cer;
    ssl_certificate_key /root/.acme.sh/qixidi.top_ecc/qixidi.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root  /data/qixidi/web-admin;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }
    # 后端 API 反向代理（末尾 / 去掉 /api 前缀）
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:9001/;
        client_max_body_size 20m;
    }
}

# MinIO 对象存储（可选；使用阿里云 OSS 时可省略本块）
server {
    listen 443 ssl http2;
    server_name minio.qixidi.top;
    access_log /data/log/nginx/minio-qixidi-top.log;
    ssl_certificate     /root/.acme.sh/qixidi.top_ecc/qixidi.top.cer;
    ssl_certificate_key /root/.acme.sh/qixidi.top_ecc/qixidi.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:9300;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        rewrite ^/pic/(.*)$ /$1 break;
        proxy_set_header  X-Real-IP    $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        # 对象存储大文件上传不限制体积（MinIO 控制台还需 WebSocket，按需加 Upgrade 头）
        client_max_body_size 0;
    }
}
